# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-maven
# codelogic-build-feedback

name: Java CI with Maven

on:
  push:
    branches: [ main, 'lineai/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{matrix.java}}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'adopt'
          cache: maven
      - name: Build with Maven Wrapper
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: ./mvnw -B verify 2>&1 | tee "${{ github.workspace }}/build.log"
      - name: Ensure Lineai build.log exists
        if: always()
        shell: bash
        run: |
          if [ ! -f "${{ github.workspace }}/build.log" ]; then
            echo "No teed build.log found; a step may have failed before log capture." > "${{ github.workspace }}/build.log"
            echo "Workflow: ${{ github.workflow }}" >> "${{ github.workspace }}/build.log"
            echo "Job status: ${{ job.status }}" >> "${{ github.workspace }}/build.log"
          fi
      - name: Send Lineai Build Info
        if: always()
        uses: lineai-intelligence/lineai-send-build-info-github-action@v1.0.3
        with:
          lineai_host: ${{ vars.LINEAI_HOST }}
          agent_uuid: ${{ vars.AGENT_UUID }}
          agent_password: ${{ secrets.AGENT_PASSWORD }}
          scan_path: /github/workspace
          job_name: ${{ github.workflow }}
          build_number: ${{ github.run_number }}
          build_status: ${{ job.status }}
          pipeline_system: GitHub Actions
          log_file: /github/workspace/build.log
