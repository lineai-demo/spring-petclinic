# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-maven

# lineai-intelligence-build-feedback
# lineai-intelligence-source-scan
name: Java CI with Maven

on:
  push:
    branches: [ main, lineai-baseline, 'lineai/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{matrix.java}}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'adopt'
          cache: maven
      - name: Build with Maven Wrapper
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: |
          set -o pipefail
          ./mvnw -B verify 2>&1 | tee ${{ github.workspace }}/build.log
      - name: Ensure Lineai build.log exists
        if: always()
        shell: bash
        run: |
          if [ ! -f "${{ github.workspace }}/build.log" ]; then
            echo "No teed build.log found; a step may have failed before log capture." > "${{ github.workspace }}/build.log"
            echo "Workflow: ${{ github.workflow }}" >> "${{ github.workspace }}/build.log"
            echo "Job status: ${{ job.status }}" >> "${{ github.workspace }}/build.log"
          fi
      - name: Send Lineai Build Info
        if: always()
        uses: lineai-intelligence/lineai-send-build-info-github-action@v1.0.3
        with:
          lineai_host: ${{ vars.LINEAI_HOST }}
          agent_uuid: ${{ vars.AGENT_UUID }}
          agent_password: ${{ secrets.AGENT_PASSWORD }}
          scan_path: /github/workspace
          job_name: ${{ github.workflow }}
          build_number: ${{ github.run_number }}
          build_status: ${{ job.status }}
          pipeline_system: GitHub Actions
          log_file: /github/workspace/build.log
      - name: Lineai Java source scan
        if: always()
        env:
          LINEAI_HOST: ${{ vars.LINEAI_HOST }}
          AGENT_UUID: ${{ vars.AGENT_UUID }}
          AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
          JAVA_METHOD_FILTER: "org.springframework.samples."
        run: |
          docker run --pull always --rm \
            --env LINEAI_HOST --env AGENT_UUID --env AGENT_PASSWORD --env JAVA_METHOD_FILTER \
            --env SCAN_PATH_FILTER=java --env SCAN_PATH_DEPTH=-1 \
            --volume "${{ github.workspace }}:/scan" \
            --entrypoint /bin/bash \
            lineaipublic.azurecr.io/lineai_source_java:latest \
            -c 'set -euo pipefail
                printf "%s\n" "${AGENT_UUID}" > /sourceCape-agent-uuid
                printf "%s\n" "${AGENT_UUID}" > /sourceCape-agent-creds
                printf "%s\n" "${AGENT_PASSWORD}" >> /sourceCape-agent-creds
                printf "%s\n" "${AGENT_UUID}" > /jCape-agent-uuid
                printf "%s\n" "${AGENT_UUID}" > /jCape-agent-creds
                printf "%s\n" "${AGENT_PASSWORD}" >> /jCape-agent-creds
                method_filter_args=()
                if [[ -n "${JAVA_METHOD_FILTER:-}" ]]; then
                  method_filter_args=(--method-filter "${JAVA_METHOD_FILTER}")
                fi
                exec /opt/entrypoint.sh analyze --type FILE \
                  --application "${{ github.event.repository.name }}" \
                  --scan-space-name "${{ github.event.repository.html_url }}|OnboardingBaselineScanSpace" \
                  --path /scan "${method_filter_args[@]}" --rescan'
